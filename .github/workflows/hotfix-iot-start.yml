name: Hotfix transport start

on:
  push:
    branches:
      - feat/wokwi-iot
    paths:
      - .github/workflows/hotfix-iot-start.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wokwi-iot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('public/js/dashboard.js')
          text = dashboard.read_text(encoding='utf-8')

          text, count = re.subn(
              r'if \(!response\.ok\) throw new Error\(data\.erro \|\| "Falha na operação"\);',
              'if (!response.ok) throw new Error(data.error || data.erro || "Falha na operação");',
              text,
              count=1,
          )
          assert count == 1, count

          selector = '".demo-panel button, .demo-panel select"'
          assert text.count(selector) == 2, text.count(selector)
          text = text.replace(selector, '".scenario-group button, .finish-transport"')

          text, count = re.subn(
              r'(\s*} else \{\n)(\s*)start\.disabled = !window\.lifeBoxCurrentPlan;\n\2start\.textContent = "▶ INICIAR TRANSPORTE";',
              lambda m: (
                  m.group(1)
                  + m.group(2)
                  + 'const availablePlan =\n'
                  + m.group(2)
                  + '  window.lifeBoxCurrentPlan || window.lifeBoxPlanningResult?.selected || null;\n'
                  + m.group(2)
                  + 'if (!window.lifeBoxCurrentPlan && availablePlan)\n'
                  + m.group(2)
                  + '  window.lifeBoxCurrentPlan = availablePlan;\n'
                  + m.group(2)
                  + 'start.disabled = !availablePlan;\n'
                  + m.group(2)
                  + 'start.textContent = "▶ INICIAR TRANSPORTE";'
              ),
              text,
              count=1,
          )
          assert count == 1, count

          needle = '    if (action) {\n      if (\n        action === "start" &&'
          assert needle in text
          replacement = '''    if (action) {
              if (
                action === "start" &&
                !window.lifeBoxCurrentPlan &&
                window.lifeBoxPlanningResult?.selected
              )
                window.lifeBoxCurrentPlan = window.lifeBoxPlanningResult.selected;
              if (
                action === "start" &&'''
          text = text.replace(needle, replacement, 1)

          needle = '            transporteId: transportId,\n            rotaId: "LOGISTICS_PLAN",'
          assert needle in text
          text = text.replace(
              needle,
              '            transporteId: transportId,\n            mode: $("#iot-mode").value,\n            rotaId: "LOGISTICS_PLAN",',
              1,
          )
          dashboard.write_text(text, encoding='utf-8')

          service = Path('src/services/simulationService.js')
          text = service.read_text(encoding='utf-8')
          needle = 'async function start(transporteId = 1, rotaId, plan, result) {'
          assert needle in text
          text = text.replace(
              needle,
              'async function start(transporteId = 1, rotaId, plan, result, sourceMode = "DEMO") {',
              1,
          )

          text, count = re.subn(
              r'  // Mantém compatibilidade com clientes antigos que iniciam o simulador\n  // diretamente, sem passar primeiro pelo seletor do dashboard\.\n  iotState\.setMode\(iotState\.MODES\.DEMO\);',
              '  const requestedMode = String(sourceMode || "DEMO").toUpperCase();\n  if (!Object.values(iotState.MODES).includes(requestedMode))\n    throw httpError(422, "INVALID_IOT_MODE", "Modo deve ser IOT ou DEMO.");\n  iotState.setMode(requestedMode);',
              text,
              count=1,
          )
          assert count == 1, count
          service.write_text(text, encoding='utf-8')

          route = Path('src/routes/simulacao.js')
          text = route.read_text(encoding='utf-8')
          needle = '        req.body.plan,\n        req.body.result,\n      ),'
          assert needle in text
          text = text.replace(
              needle,
              '        req.body.plan,\n        req.body.result,\n        req.body.mode,\n      ),',
              1,
          )
          route.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax and lint
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
      - name: Commit hotfix
        run: |
          git config user.name "Sandro Ferreira"
          git config user.email "sandrozdb@gmail.com"
          git add public/js/dashboard.js src/services/simulationService.js src/routes/simulacao.js
          git commit -m "fix: start transport in demo and iot modes"
          git push origin feat/wokwi-iot
