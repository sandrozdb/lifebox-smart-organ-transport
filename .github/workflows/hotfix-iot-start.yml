name: Hotfix transport start

on:
  push:
    branches:
      - feat/wokwi-iot
    paths:
      - .github/workflows/hotfix-iot-start.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wokwi-iot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('public/js/dashboard.js')
          text = dashboard.read_text(encoding='utf-8')

          old = 'if (!response.ok) throw new Error(data.erro || "Falha na operação");'
          new = 'if (!response.ok) throw new Error(data.error || data.erro || "Falha na operação");'
          assert old in text
          text = text.replace(old, new, 1)

          selector = '".demo-panel button, .demo-panel select"'
          assert text.count(selector) == 2, text.count(selector)
          text = text.replace(selector, '".scenario-group button, .finish-transport"')

          old = '''  } else {
            start.disabled = !window.lifeBoxCurrentPlan;
            start.textContent = "▶ INICIAR TRANSPORTE";'''
          new = '''  } else {
            const availablePlan =
              window.lifeBoxCurrentPlan || window.lifeBoxPlanningResult?.selected || null;
            if (!window.lifeBoxCurrentPlan && availablePlan)
              window.lifeBoxCurrentPlan = availablePlan;
            start.disabled = !availablePlan;
            start.textContent = "▶ INICIAR TRANSPORTE";'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if (action) {
              if (
                action === "start" &&'''
          new = '''    if (action) {
              if (
                action === "start" &&
                !window.lifeBoxCurrentPlan &&
                window.lifeBoxPlanningResult?.selected
              )
                window.lifeBoxCurrentPlan = window.lifeBoxPlanningResult.selected;
              if (
                action === "start" &&'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            transporteId: transportId,
                    rotaId: "LOGISTICS_PLAN",'''
          new = '''            transporteId: transportId,
                    mode: $("#iot-mode").value,
                    rotaId: "LOGISTICS_PLAN",'''
          assert old in text
          text = text.replace(old, new, 1)
          dashboard.write_text(text, encoding='utf-8')

          service = Path('src/services/simulationService.js')
          text = service.read_text(encoding='utf-8')
          old = 'async function start(transporteId = 1, rotaId, plan, result) {'
          new = 'async function start(transporteId = 1, rotaId, plan, result, sourceMode = "DEMO") {'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  // Mantém compatibilidade com clientes antigos que iniciam o simulador
            // diretamente, sem passar primeiro pelo seletor do dashboard.
            iotState.setMode(iotState.MODES.DEMO);'''
          new = '''  const requestedMode = String(sourceMode || "DEMO").toUpperCase();
            if (!Object.values(iotState.MODES).includes(requestedMode))
              throw httpError(422, "INVALID_IOT_MODE", "Modo deve ser IOT ou DEMO.");
            iotState.setMode(requestedMode);'''
          assert old in text
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          route = Path('src/routes/simulacao.js')
          text = route.read_text(encoding='utf-8')
          old = '''        req.body.plan,
                req.body.result,
              ),'''
          new = '''        req.body.plan,
                req.body.result,
                req.body.mode,
              ),'''
          assert old in text
          text = text.replace(old, new, 1)
          route.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax and lint
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
      - name: Commit hotfix
        run: |
          git config user.name "Sandro Ferreira"
          git config user.email "sandrozdb@gmail.com"
          git add public/js/dashboard.js src/services/simulationService.js src/routes/simulacao.js
          git commit -m "fix: start transport in demo and iot modes"
          git push origin feat/wokwi-iot
