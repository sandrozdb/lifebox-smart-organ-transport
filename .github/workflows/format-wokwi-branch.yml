name: Format Wokwi branch

on:
  push:
    branches:
      - feat/wokwi-iot
    paths:
      - .github/workflows/format-wokwi-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wokwi-iot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format files reported by CI
        run: |
          npx prettier --write \
            firmware/diagram.json \
            firmware/README.md \
            public/css/styles.css \
            public/js/dashboard.js \
            src/config/index.js \
            src/routes/iot.js \
            src/services/iotStateService.js \
            src/services/simulationService.js \
            src/services/telemetryService.js \
            tests/e2e/lifebox.spec.js \
            tests/iot-state.test.js
      - name: Commit formatting
        run: |
          git config user.name "Sandro Ferreira"
          git config user.email "sandrozdb@gmail.com"
          git add firmware/diagram.json firmware/README.md public/css/styles.css public/js/dashboard.js src/config/index.js src/routes/iot.js src/services/iotStateService.js src/services/simulationService.js src/services/telemetryService.js tests/e2e/lifebox.spec.js tests/iot-state.test.js
          git commit -m "style: format Wokwi IoT branch"
          git push origin feat/wokwi-iot
